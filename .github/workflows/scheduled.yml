name: Nightly Regression

on:
  schedule:
    # Runs at 02:00 UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch: {}

env:
  NODE_VERSION: '24'

jobs:
  build-api:
    uses: ./.github/workflows/build-api.yml

  regression:
    name: 'Nightly regression | ${{ matrix.browser }}'
    runs-on: ubuntu-latest
    needs: build-api
    timeout-minutes: 90
    permissions:
      checks: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: ./node_modules/.bin/playwright install --with-deps

      - name: Install browser system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: ./node_modules/.bin/playwright install-deps

      - name: Boot movie-catalog stack
        uses: ./.github/actions/boot-stack
        with:
          auth-username: ${{ secrets.AUTH_USERNAME }}
          auth-password: ${{ secrets.AUTH_PASSWORD }}
          jwt-secret: ${{ secrets.JWT_SECRET }}

      - name: Run full regression
        run: ./node_modules/.bin/playwright test --grep @regression --project=${{ matrix.browser }}
        env:
          CI: true
          HEADLESS: 'true'
          TIMEOUT: '60000'
          BASE_URL: http://localhost:4200
          API_URL: http://localhost:8080/api/v1
          MOVIE_CATALOG_USERNAME: ${{ secrets.AUTH_USERNAME }}
          MOVIE_CATALOG_PASSWORD: ${{ secrets.AUTH_PASSWORD }}

      - name: Redact credentials from test artifacts
        if: always()
        run: ./scripts/redact-secrets.sh playwright-report test-results
        env:
          SECRETS: '${{ secrets.AUTH_USERNAME }} ${{ secrets.AUTH_PASSWORD }}'

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report-${{ matrix.browser }}-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results (JUnit)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-regression-${{ matrix.browser }}-${{ github.run_id }}
          path: test-results/junit.xml
          retention-days: 30

      - name: Upload failure artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regression-failures-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            test-results/
            !test-results/junit.xml
          retention-days: 7

      - name: Publish test summary
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        if: always()
        with:
          name: Nightly Regression (${{ matrix.browser }})
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

  notify-on-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: regression
    if: failure()

    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly regression failed - ${date}`,
              body: `The nightly regression run failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'ci-failure'],
            });
