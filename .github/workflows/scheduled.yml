name: Nightly Regression

on:
  schedule:
    # Runs at 02:00 UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options: [dev, staging, prod]

env:
  NODE_VERSION: '24'

jobs:
  regression:
    name: 'Nightly regression | ${{ matrix.browser }} | ${{ github.event_name == ''workflow_dispatch'' && inputs.environment || ''staging'' }}'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      checks: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: ./node_modules/.bin/playwright install --with-deps

      - name: Install browser system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: ./node_modules/.bin/playwright install-deps

      - name: Resolve environment config
        env:
          BASE_URL_DEV:      ${{ secrets.BASE_URL_DEV }}
          BASE_URL_STAGING:  ${{ secrets.BASE_URL_STAGING }}
          BASE_URL_PROD:     ${{ secrets.BASE_URL_PROD }}
          API_URL_DEV:       ${{ secrets.API_URL_DEV }}
          API_URL_STAGING:   ${{ secrets.API_URL_STAGING }}
          API_URL_PROD:      ${{ secrets.API_URL_PROD }}
        run: |
          ENV_NAME="${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}"
          echo "ENV=${ENV_NAME}"  >> $GITHUB_ENV
          echo "HEADLESS=true"    >> $GITHUB_ENV

          case "$ENV_NAME" in
            dev)
              echo "BASE_URL=${BASE_URL_DEV}" >> $GITHUB_ENV
              echo "API_URL=${API_URL_DEV}"   >> $GITHUB_ENV
              echo "TIMEOUT=30000"            >> $GITHUB_ENV
              ;;
            prod)
              echo "BASE_URL=${BASE_URL_PROD}" >> $GITHUB_ENV
              echo "API_URL=${API_URL_PROD}"   >> $GITHUB_ENV
              echo "TIMEOUT=60000"             >> $GITHUB_ENV
              ;;
            *)
              echo "BASE_URL=${BASE_URL_STAGING}" >> $GITHUB_ENV
              echo "API_URL=${API_URL_STAGING}"   >> $GITHUB_ENV
              echo "TIMEOUT=60000"                >> $GITHUB_ENV
              ;;
          esac

      - name: Run full regression
        run: ./node_modules/.bin/playwright test --grep @regression --project=${{ matrix.browser }}
        env:
          CI: true
          MOVIE_CATALOG_USERNAME: ${{ secrets.AUTH_USERNAME }}
          MOVIE_CATALOG_PASSWORD: ${{ secrets.AUTH_PASSWORD }}

      - name: Redact credentials from test artifacts
        if: always()
        run: ./scripts/redact-secrets.sh playwright-report test-results
        env:
          SECRETS: '${{ secrets.AUTH_USERNAME }} ${{ secrets.AUTH_PASSWORD }}'

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report-${{ matrix.browser }}-${{ github.run_id }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test results (JUnit)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-regression-${{ matrix.browser }}-${{ github.run_id }}
          path: test-results/junit.xml
          retention-days: 30

      - name: Upload failure artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regression-failures-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            test-results/
            !test-results/junit.xml
          retention-days: 7

      - name: Publish test summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Nightly Regression (${{ matrix.browser }})
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

  notify-on-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: regression
    if: failure()

    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly regression failed - ${date}`,
              body: `The nightly regression run failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'ci-failure'],
            });