name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'smoke'
        type: choice
        options: [smoke, regression, api, a11y, visual, unit, all]
      browser:
        description: 'Browser'
        required: true
        default: 'chromium'
        type: choice
        options: [chromium, firefox, all]

env:
  NODE_VERSION: '24'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  build-api:
    uses: ./.github/workflows/build-api.yml

  test:
    name: '${{ github.event_name == ''workflow_dispatch'' && inputs.test_suite || ''regression'' }} | ${{ github.event_name == ''workflow_dispatch'' && inputs.browser || ''chromium'' }} | shard ${{ matrix.shard }}/${{ strategy.job-total }}'
    runs-on: ubuntu-latest
    needs: build-api
    timeout-minutes: 60
    permissions:
      checks: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: ./node_modules/.bin/playwright install --with-deps

      - name: Install browser system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: ./node_modules/.bin/playwright install-deps

      - name: Boot movie-catalog stack
        uses: ./.github/actions/boot-stack
        with:
          auth-username: ${{ secrets.AUTH_USERNAME }}
          auth-password: ${{ secrets.AUTH_PASSWORD }}
          jwt-secret: ${{ secrets.JWT_SECRET }}

      - name: Resolve test command
        id: cmd
        run: |
          SUITE="${{ github.event_name == 'workflow_dispatch' && inputs.test_suite || 'regression' }}"
          BROWSER="${{ github.event_name == 'workflow_dispatch' && inputs.browser || 'chromium' }}"

          CMD="./node_modules/.bin/playwright test"
          if [ "$SUITE" != "all" ]; then
            CMD="$CMD --grep @${SUITE}"
          fi
          [ "$BROWSER" != "all" ] && CMD="$CMD --project=${BROWSER}"
          CMD="$CMD --shard=${{ matrix.shard }}/${{ strategy.job-total }}"

          echo "cmd=${CMD}" >> $GITHUB_OUTPUT

      - name: Run tests
        run: ${{ steps.cmd.outputs.cmd }}
        env:
          CI: true
          HEADLESS: 'true'
          TIMEOUT: '30000'
          BASE_URL: http://localhost:4200
          API_URL: http://localhost:8080/api/v1
          MOVIE_CATALOG_USERNAME: ${{ secrets.AUTH_USERNAME }}
          MOVIE_CATALOG_PASSWORD: ${{ secrets.AUTH_PASSWORD }}

      - name: Redact credentials from test artifacts
        if: always()
        run: ./scripts/redact-secrets.sh playwright-report allure-results test-results
        env:
          SECRETS: '${{ secrets.AUTH_USERNAME }} ${{ secrets.AUTH_PASSWORD }}'

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.shard }}-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-${{ matrix.shard }}-${{ github.run_id }}
          path: allure-results/
          retention-days: 3

      - name: Upload test results (JUnit)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-results-${{ matrix.shard }}-${{ github.run_id }}
          path: test-results/junit.xml
          retention-days: 14

      - name: Upload failure artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: failure-artifacts-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            test-results/
            !test-results/junit.xml
          retention-days: 7

      - name: Publish test summary
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        if: always()
        with:
          name: 'Playwright Results - Shard ${{ matrix.shard }}'
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

  allure-report:
    name: Allure Report
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download Allure results from all shards
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*-${{ github.run_id }}
          merge-multiple: true
          path: allure-results/

      - name: Restore Allure history for trending
        uses: dawidd6/action-download-artifact@8305c0f1062bb0d184d09ef4493ecb9288447732
        continue-on-error: true
        with:
          name: allure-history
          path: allure-history/
          workflow: playwright.yml
          branch: main
          event: push

      - name: Apply history to results
        run: |
          if [ -d "allure-history" ] && [ "$(ls -A allure-history)" ]; then
            mkdir -p allure-results/history
            cp -r allure-history/. allure-results/history/
            echo "Allure history restored from previous run"
          else
            echo "No previous history - this is the first run or no successful push to main"
          fi

      - name: Install Allure CLI
        run: npm install -g allure-commandline@2.42.0 --ignore-scripts

      - name: Generate Allure report
        run: |
          if [ -d "allure-results" ] && [ "$(ls -A allure-results)" ]; then
            allure generate allure-results --clean -o allure-report
          else
            echo "No allure-results found, skipping"
          fi

      - name: Save Allure history for next run
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-history
          path: allure-report/history/
          overwrite: true
          retention-days: 90

      - name: Upload Allure report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-report-${{ github.run_id }}
          path: allure-report/
          retention-days: 14

  publish-report:
    name: Publish Allure Report to GitHub Pages
    runs-on: ubuntu-latest
    needs: allure-report
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Download Allure report
        uses: actions/download-artifact@v7
        with:
          name: allure-report-${{ github.run_id }}
          path: allure-report/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
