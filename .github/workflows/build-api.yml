name: Build movie-catalog-api (reusable)

on:
  workflow_call: {}

jobs:
  build-api:
    name: Build movie-catalog-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout movie-catalog-api
        uses: actions/checkout@v7
        with:
          repository: EnesAkyel/movie-catalog-api
          path: movie-catalog-api

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: movie-catalog-api/pom.xml

      - name: Build
        working-directory: movie-catalog-api
        run: ./mvnw package -DskipTests -q

      - name: Upload application JAR
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: movie-catalog-api/target/movie-catalog-api-*.jar
          retention-days: 1
