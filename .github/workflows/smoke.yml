name: Smoke (movie-catalog-ui)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

env:
  NODE_VERSION: '24'

jobs:
  build-api:
    name: Build movie-catalog-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout movie-catalog-api
        uses: actions/checkout@v7
        with:
          repository: EnesAkyel/movie-catalog-api
          path: movie-catalog-api

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build
        working-directory: movie-catalog-api
        run: ./mvnw package -DskipTests -q

      - name: Upload application JAR
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: movie-catalog-api/target/movie-catalog-api-*.jar
          retention-days: 1

  smoke:
    name: Smoke test (chromium)
    runs-on: ubuntu-latest
    needs: build-api
    permissions:
      contents: read
    steps:
      - name: Checkout playwright-ts
        uses: actions/checkout@v7

      - name: Checkout movie-catalog-api
        uses: actions/checkout@v7
        with:
          repository: EnesAkyel/movie-catalog-api
          path: movie-catalog-api

      - name: Checkout movie-catalog-ui
        uses: actions/checkout@v7
        with:
          repository: EnesAkyel/movie-catalog-ui
          path: movie-catalog-ui

      - name: Start movie-catalog-api
        uses: ./.github/actions/start-api
        with:
          auth-username: ${{ secrets.AUTH_USERNAME }}
          auth-password: ${{ secrets.AUTH_PASSWORD }}
          jwt-secret: ${{ secrets.JWT_SECRET }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Build movie-catalog-ui
        working-directory: movie-catalog-ui
        run: |
          npm ci
          npm run build

      - name: Serve movie-catalog-ui
        working-directory: movie-catalog-ui
        run: |
          npx serve -s dist/movie-catalog-ui/browser -l 4200 &
          echo "Waiting for movie-catalog-ui..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4200 > /dev/null; then
              echo "movie-catalog-ui is ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "movie-catalog-ui did not become ready in time"
          exit 1

      - name: Install playwright-ts dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run smoke tests
        run: ./node_modules/.bin/playwright test --project=chromium --grep @smoke
        env:
          CI: true
          HEADLESS: 'true'
          TIMEOUT: '30000'
          BASE_URL: http://localhost:4200
          API_URL: http://localhost:8080/api/v1
          MOVIE_CATALOG_USERNAME: ${{ secrets.AUTH_USERNAME }}
          MOVIE_CATALOG_PASSWORD: ${{ secrets.AUTH_PASSWORD }}

      - name: Redact credentials from test artifacts
        if: always()
        run: ./scripts/redact-secrets.sh playwright-report test-results
        env:
          SECRETS: '${{ secrets.AUTH_USERNAME }} ${{ secrets.AUTH_PASSWORD }}'

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7
