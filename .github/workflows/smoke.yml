name: Smoke (movie-catalog-ui)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

env:
  NODE_VERSION: '24'

jobs:
  build-api:
    uses: ./.github/workflows/build-api.yml

  smoke:
    name: Smoke test (chromium)
    runs-on: ubuntu-latest
    needs: build-api
    permissions:
      contents: read
    steps:
      - name: Checkout playwright-ts
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Boot movie-catalog stack
        uses: ./.github/actions/boot-stack
        with:
          auth-username: ${{ secrets.AUTH_USERNAME }}
          auth-password: ${{ secrets.AUTH_PASSWORD }}
          jwt-secret: ${{ secrets.JWT_SECRET }}

      - name: Install playwright-ts dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run smoke tests
        run: ./node_modules/.bin/playwright test --project=chromium --grep @smoke
        env:
          CI: true
          HEADLESS: 'true'
          TIMEOUT: '30000'
          BASE_URL: http://localhost:4200
          API_URL: http://localhost:8080/api/v1
          MOVIE_CATALOG_USERNAME: ${{ secrets.AUTH_USERNAME }}
          MOVIE_CATALOG_PASSWORD: ${{ secrets.AUTH_PASSWORD }}

      - name: Redact credentials from test artifacts
        if: always()
        run: ./scripts/redact-secrets.sh playwright-report test-results
        env:
          SECRETS: '${{ secrets.AUTH_USERNAME }} ${{ secrets.AUTH_PASSWORD }}'

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7
