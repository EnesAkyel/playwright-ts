name: Update Visual Snapshots

on:
  workflow_dispatch: {}

jobs:
  build-api:
    uses: ./.github/workflows/build-api.yml

  update-snapshots:
    name: Regenerate Linux baselines
    runs-on: ubuntu-latest
    needs: build-api
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox

      - name: Boot movie-catalog stack
        uses: ./.github/actions/boot-stack
        with:
          auth-username: ${{ secrets.AUTH_USERNAME }}
          auth-password: ${{ secrets.AUTH_PASSWORD }}
          jwt-secret: ${{ secrets.JWT_SECRET }}

      - name: Generate Linux baselines
        run: ./node_modules/.bin/playwright test --grep @visual --update-snapshots
        env:
          CI: true
          HEADLESS: 'true'
          TIMEOUT: '60000'
          BASE_URL: http://localhost:4200
          API_URL: http://localhost:8080/api/v1
          MOVIE_CATALOG_USERNAME: ${{ secrets.AUTH_USERNAME }}
          MOVIE_CATALOG_PASSWORD: ${{ secrets.AUTH_PASSWORD }}

      - name: Redact credentials from test artifacts
        if: always()
        run: ./scripts/redact-secrets.sh test-results
        env:
          SECRETS: '${{ secrets.AUTH_USERNAME }} ${{ secrets.AUTH_PASSWORD }}'

      - name: Upload snapshots as artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-visual-snapshots
          path: src/tests/moviecatalog/**/*-linux.png
          retention-days: 7
