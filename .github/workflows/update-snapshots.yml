name: Update Visual Snapshots

on:
  workflow_dispatch: {}

jobs:
  update-snapshots:
    name: Regenerate Linux baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox

      - name: Resolve staging env
        env:
          BASE_URL_STAGING: ${{ secrets.BASE_URL_STAGING }}
          API_URL_STAGING:  ${{ secrets.API_URL_STAGING }}
        run: |
          echo "ENV=staging"                    >> $GITHUB_ENV
          echo "HEADLESS=true"                  >> $GITHUB_ENV
          echo "TIMEOUT=60000"                  >> $GITHUB_ENV
          echo "BASE_URL=${BASE_URL_STAGING}"   >> $GITHUB_ENV
          echo "API_URL=${API_URL_STAGING}"     >> $GITHUB_ENV

      - name: Generate Linux baselines
        run: ./node_modules/.bin/playwright test --grep @visual --update-snapshots
        env:
          CI: true
          MOVIE_CATALOG_USERNAME: ${{ secrets.AUTH_USERNAME }}
          MOVIE_CATALOG_PASSWORD: ${{ secrets.AUTH_PASSWORD }}

      - name: Redact credentials from test artifacts
        if: always()
        run: ./scripts/redact-secrets.sh test-results
        env:
          SECRETS: '${{ secrets.AUTH_USERNAME }} ${{ secrets.AUTH_PASSWORD }}'

      - name: Upload snapshots as artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-visual-snapshots
          path: src/tests/moviecatalog/**/*-linux.png
          retention-days: 7
