services:
  playwright:
    build: .
    ipc: host          # Chromium needs shared memory - avoids renderer crashes
    shm_size: '2gb'
    environment:
      CI: 'true'
      ENV: ${ENV:-staging}
      BASE_URL: ${BASE_URL}
      API_URL: ${API_URL}
      MOVIE_CATALOG_USERNAME: ${MOVIE_CATALOG_USERNAME}
      MOVIE_CATALOG_PASSWORD: ${MOVIE_CATALOG_PASSWORD}
      HEADLESS: 'true'
      TIMEOUT: ${TIMEOUT:-60000}
    volumes:
      # Mount output directories so results are accessible on the host after the run
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
      - ./allure-results:/app/allure-results
